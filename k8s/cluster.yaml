# Sharded VectorForge cluster: 3 shards + 1 coordinator (Phase 5, Day 33).
#
# This is the distributed deployment, an alternative to the single-node
# k8s/vectorforge.yaml. The same image runs in three roles by overriding the
# command:
#   - shards run the gRPC server (python -m vectorforge.grpc_server)
#   - the coordinator runs the REST front door (uvicorn coordinator_api:app)
#
# Shards are a StatefulSet behind a headless Service, so each pod gets a stable
# DNS name (vf-shard-0.vf-shards, vf-shard-1.vf-shards, ...). The coordinator
# needs those names to be fixed, since its hash ring is keyed by shard address.
# The index is in memory, so each shard genuinely owns a different slice of the
# data; that is the point, not a limitation here.
#
# Apply after loading the image into kind:
#   kind load docker-image vectorforge:latest --name vectorforge
#   kubectl apply -f k8s/cluster.yaml
#   kubectl port-forward svc/vf-coordinator 8000:8000
---
apiVersion: v1
kind: Service
metadata:
  name: vf-shards
  labels:
    app: vf-shard
spec:
  # Headless: gives each StatefulSet pod a stable DNS record instead of load
  # balancing across them, which is what per-shard addressing needs.
  clusterIP: None
  selector:
    app: vf-shard
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vf-shard
  labels:
    app: vf-shard
spec:
  serviceName: vf-shards
  replicas: 3
  selector:
    matchLabels:
      app: vf-shard
  template:
    metadata:
      labels:
        app: vf-shard
        component: shard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: shard
          image: vectorforge:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vectorforge.grpc_server"]
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: VECTORFORGE_GRPC_PORT
              value: "50051"
            - name: VECTORFORGE_DIM
              value: "128"
            - name: VECTORFORGE_M
              value: "16"
            - name: VECTORFORGE_EF_CONSTRUCTION
              value: "200"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # No HTTP on a shard, so probe the gRPC port at the TCP level.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vf-coordinator
  labels:
    app: vf-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vf-coordinator
  template:
    metadata:
      labels:
        app: vf-coordinator
        component: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: coordinator
          image: vectorforge:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - vectorforge.coordinator_api:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            # The ring is keyed by these addresses; they must match the shard
            # count and the headless Service name above.
            - name: VECTORFORGE_SHARDS
              value: "vf-shard-0.vf-shards:50051,vf-shard-1.vf-shards:50051,vf-shard-2.vf-shards:50051"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: vf-coordinator
  labels:
    app: vf-coordinator
spec:
  type: ClusterIP
  selector:
    app: vf-coordinator
  ports:
    - name: http
      port: 8000
      targetPort: http
